baseURL: "https://hellobeautyblog.com/"
title: "Hello Beauty Blog"
languageCode: "en"
defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false
disableAliases: true

enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true

timeout: "60s"
disableKinds:
  - taxonomy
  - term

taxonomies:
  brand: "brands"
  category: "categories"
  tag: "tags"
  ingredient: "ingredients"

permalinks:
  perfumes: "/perfumes/:slug/"
  skincare: "/skincare/:slug/"
  makeup: "/makeup/:slug/"
  haircare: "/haircare/:slug/"
  guides: "/guides/:slug/"
  blog: "/blog/:slug/"
  brands: "/brands/:slug/"

paginate: 24
paginatePath: "page"

minify:
  minifyOutput: true

markup:
  goldmark:
    renderer:
      unsafe: true
