# =============================================================================
# HELLO BEAUTY BLOG - Configuration Principale
# =============================================================================

baseURL: "https://hellobeautyblog.com/"
title: "Hello Beauty Blog"
languageCode: "en"
defaultContentLanguage: "en"
defaultContentLanguageInSubdir: true
disableAliases: true
theme: "hellobeauty"

enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true

timeout: "60s"
disableKinds:
  - taxonomy
  - term

taxonomies:
  brand: "brands"
  category: "categories"
  tag: "tags"
  ingredient: "ingredients"

# Permalinks are now defined per-language in languages.yaml

paginate: 24
paginatePath: "page"

minify:
  minifyOutput: true

markup:
  goldmark:
    renderer:
      unsafe: true
