        .stats-bar { display: flex; justify-content: center; gap: 12px; margin-bottom: 15px; flex-wrap: wrap; }
        .stat { background: white; padding: 10px 16px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); text-align: center; min-width: 90px; }
        .stat-number { font-size: 1.3rem; font-weight: 700; }
        .stat-label { color: #6B7280; font-size: 0.7rem; }
        .stat.pending .stat-number { color: #F59E0B; }
        .stat.validated .stat-number { color: #10B981; }
        .stat.rejected .stat-number { color: #EF4444; }
        .stat.history .stat-number { color: #6B7280; }
        
        /* Controls */
        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
        .tab { padding: 8px 14px; border: none; background: white; border-radius: 20px; cursor: pointer; font-weight: 500; font-size: 0.8rem; transition: all 0.2s; }
        .tab:hover { background: #F8C8DC; }
        .tab.active { background: #F8C8DC; }
        
        .filter-bar { display: flex; gap: 6px; flex-wrap: wrap; }
        .filter-btn { padding: 6px 12px; border: 2px solid #E5E7EB; background: white; border-radius: 15px; cursor: pointer; font-size: 0.75rem; transition: all 0.2s; }
        .filter-btn:hover, .filter-btn.active { border-color: #F8C8DC; background: #FDF2F8; }
        .filter-count { background: #E5E7EB; padding: 2px 5px; border-radius: 6px; font-size: 0.65rem; margin-left: 3px; }
        
        .source-bar { display: flex; gap: 6px; align-items: center; }
        .source-btn { padding: 6px 12px; border: 2px solid #E5E7EB; background: white; border-radius: 15px; cursor: pointer; font-size: 0.75rem; }
        .source-btn:hover, .source-btn.active { border-color: #8B5CF6; background: #EDE9FE; }
        
        .bulk-actions { display: flex; gap: 8px; }
        .bulk-btn { padding: 8px 16px; border: none; border-radius: 15px; cursor: pointer; font-weight: 600; font-size: 0.8rem; }
        .bulk-validate { background: #10B981; color: white; }
        .bulk-validate:hover { background: #059669; }
        .bulk-reject { background: #FEE2E2; color: #EF4444; }
        .select-all { background: #E0E7FF; color: #3730A3; }
        .clear-history { background: #FEF3C7; color: #92400E; }
        
        /* Pagination */
        .pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .page-btn { padding: 8px 14px; border: none; background: white; border-radius: 8px; cursor: pointer; font-weight: 500; transition: all 0.2s; }
        .page-btn:hover { background: #F8C8DC; }
        .page-btn.active { background: #8B5CF6; color: white; }
        .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .page-info { color: #6B7280; font-size: 0.85rem; }
        .per-page select { padding: 6px 10px; border: 1px solid #E5E7EB; border-radius: 6px; }

            gap: 12px;
            margin-bottom: 100px;
        }
        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);

            display: flex;
            flex-direction: column;
            position: relative;
            padding: 12px;
        }
        .product-card:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .product-card.validated { border-left: 4px solid #10B981; }
        .product-card.rejected { border-left: 4px solid #EF4444; opacity: 0.6; }
        .product-card.selected { outline: 3px solid #8B5CF6; }
        
        .product-checkbox { position: absolute; top: 10px; right: 10px; width: 20px; height: 20px; cursor: pointer; z-index: 10; accent-color: #8B5CF6; }
        
        .product-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .product-icon { font-size: 2rem; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #FDF2F8 0%, #FECDD3 100%); border-radius: 10px; }
        .product-badges { display: flex; flex-direction: column; gap: 4px; }
        
        .badge { padding: 2px 8px; border-radius: 10px; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; }
        .badge-top { background: #DC2626; color: white; animation: pulse 2s infinite; }
        .badge-new { background: #10B981; color: white; }
        .badge-2026 { background: #8B5CF6; color: white; }
        .badge-trending { background: #F59E0B; color: white; }
        
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        
        .product-category { display: inline-block; padding: 2px 6px; border-radius: 10px; font-size: 0.6rem; font-weight: 600; text-transform: uppercase; }

        .cat-makeup { background: #FCE7F3; color: #BE185D; }
        .cat-haircare { background: #FEF3C7; color: #92400E; }
        .cat-fragrance { background: #E0E7FF; color: #3730A3; }
        
        .product-brand { font-size: 0.7rem; color: #6B7280; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        .product-name { font-size: 0.95rem; font-weight: 700; color: #1F2937; line-height: 1.3; margin: 4px 0; }
        .product-description { color: #6B7280; font-size: 0.75rem; line-height: 1.4; margin-bottom: 8px; flex: 1; }
        .product-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.65rem; margin-bottom: 8px; padding-top: 8px; border-top: 1px solid #F3F4F6; }
        .product-source { color: #9CA3AF; }
        .product-source a { color: #F472B6; text-decoration: none; }
        .product-year { background: #F3F4F6; padding: 2px 6px; border-radius: 6px; color: #6B7280; font-weight: 600; }
        
        .product-actions { display: flex; gap: 6px; }
        .btn { flex: 1; padding: 8px 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.8rem; transition: all 0.2s; }
        .btn-validate { background: #10B981; color: white; }
        .btn-validate:hover { background: #059669; }
        .btn-reject { background: #FEE2E2; color: #EF4444; }
        .btn-reject:hover { background: #FECACA; }
        .btn-undo { background: #E5E7EB; color: #4B5563; }
        
        /* Generation Panel */
        .generation-panel {

            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 12px 20px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            transform: translateY(100%);
            transition: transform 0.3s;

        /* Toast */
        .toast { position: fixed; bottom: 100px; right: 20px; padding: 10px 18px; background: #1F2937; color: white; border-radius: 8px; font-weight: 500; opacity: 0; transform: translateY(20px); transition: all 0.3s; z-index: 1000; font-size: 0.85rem; }

</head>

        // STATE
        let history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        let products = [];
        let selectedProducts = new Set();
        let currentStatusFilter = 'pending';
        let currentCategoryFilter = 'all';
        let currentSourceFilter = 'all';
        let currentPage = 1;
        let itemsPerPage = 25;
        
        // Initialize products with history
        function initProducts() {
            products = ALL_PRODUCTS.map(p => ({
                ...p,
                status: history[p.id] || 'pending'
            })).filter(p => currentStatusFilter === 'all' || p.status !== 'rejected' || currentStatusFilter === 'validated');
        }
        
        function saveHistory() {
            const h = {};
            products.forEach(p => {
                if (p.status !== 'pending') h[p.id] = p.status;
            });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(h));
            history = h;
        }
        
        function clearHistory() {
            if (confirm('Effacer tout l\'historique ? Les produits rejetés réapparaîtront.')) {
                localStorage.removeItem(STORAGE_KEY);
                history = {};
                initProducts();
                renderProducts();
                showToast('Historique effacé', 'info');
            }
        }
        
        // Helpers
        function getCategoryClass(cat) { return `cat-${cat}`; }
        function getCategoryIcon(cat) {
            const icons = { skincare: '🧴', makeup: '💄', haircare: '💇', fragrance: '🌸' };
            return icons[cat] || '📦';
        }
        
        function getSourceKey(source) {
            if (source.includes('sephora')) return 'sephora';
            if (source.includes('douglas')) return 'douglas';
            return 'fragrance';
        }
        
        function getFilteredProducts() {
            return products.filter(p => {
                const statusMatch = currentStatusFilter === 'all' || p.status === currentStatusFilter;
                const categoryMatch = currentCategoryFilter === 'all' || p.category === currentCategoryFilter;
                const sourceMatch = currentSourceFilter === 'all' || getSourceKey(p.source) === currentSourceFilter;
                // Hide rejected unless viewing all
                const showRejected = currentStatusFilter === 'all';
                if (p.status === 'rejected' && !showRejected) return false;
                return statusMatch && categoryMatch && sourceMatch;
            });
        }
        
        function renderFilterBar() {
            const categories = [...new Set(ALL_PRODUCTS.map(p => p.category))];
            const filterBar = document.getElementById('filter-bar');
            
            let html = `<button class="filter-btn active" data-category="all">Toutes <span class="filter-count">${products.length}</span></button>`;
            categories.forEach(cat => {
                const count = products.filter(p => p.category === cat).length;
                html += `<button class="filter-btn" data-category="${cat}">${getCategoryIcon(cat)} ${cat} <span class="filter-count">${count}</span></button>`;
            });
            filterBar.innerHTML = html;
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentCategoryFilter = btn.dataset.category;
                    currentPage = 1;
                    renderProducts();
                });
            });
        }
        
        function renderPagination(containerId) {
            const filtered = getFilteredProducts();
            const totalPages = Math.ceil(filtered.length / itemsPerPage);
            const container = document.getElementById(containerId);
            
            if (totalPages <= 1) { container.innerHTML = ''; return; }
            
            let html = `<button class="page-btn" onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>◀</button>`;
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    html += `<span class="page-info">...</span>`;
                }
            }
            html += `<button class="page-btn" onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>▶</button>`;
            html += `<span class="page-info">(${filtered.length} produits)</span>`;
            html += `<select onchange="changePerPage(this.value)">
                <option value="25" ${itemsPerPage===25?'selected':''}>25/page</option>
                <option value="50" ${itemsPerPage===50?'selected':''}>50/page</option>
                <option value="100" ${itemsPerPage===100?'selected':''}>100/page</option>
            </select>`;
            
            container.innerHTML = html;
        }
        
        function goToPage(page) {
            const totalPages = Math.ceil(getFilteredProducts().length / itemsPerPage);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderProducts();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        function changePerPage(value) {
            itemsPerPage = parseInt(value);
            currentPage = 1;
            renderProducts();
        }
        
        function renderProducts() {
            const grid = document.getElementById('products-grid');
            const filtered = getFilteredProducts();
            const start = (currentPage - 1) * itemsPerPage;
            const pageProducts = filtered.slice(start, start + itemsPerPage);
            
            renderPagination('pagination-top');
            renderPagination('pagination-bottom');
            
            if (pageProducts.length === 0) {
                grid.innerHTML = `<div class="empty-state"><div class="emoji">📭</div><p>Aucun produit à afficher</p></div>`;
                updateStats();
                return;
            }
            
            grid.innerHTML = pageProducts.map(p => {
                const isTop = isTopBrand(p.brand);
                return `
                <div class="product-card ${p.status} ${selectedProducts.has(p.id) ? 'selected' : ''}" data-id="${p.id}">
                    <input type="checkbox" class="product-checkbox" ${selectedProducts.has(p.id) ? 'checked' : ''} onchange="toggleSelect('${p.id}', this.checked)">
                    
                    <div class="product-header">
                        <div class="product-icon">${getCategoryIcon(p.category)}</div>
                        <div class="product-badges">
                            ${isTop ? '<span class="badge badge-top">🔴 TOP</span>' : ''}
                            ${p.badge ? `<span class="badge badge-${p.badge}">${p.badge === '2026' ? '2026' : p.badge === 'new' ? 'NEW' : '🔥'}</span>` : ''}
                            <span class="product-category ${getCategoryClass(p.category)}">${p.category}</span>
                        </div>
                    </div>
                    
                    <div class="product-brand">${p.brand}</div>
                    <div class="product-name">${p.name}</div>
                    <p class="product-description">${p.description}</p>
                    
                    <div class="product-meta">
                        <span class="product-source"><a href="${p.url}" target="_blank">🔗 ${p.source}</a></span>
                        <span class="product-year">${p.year}</span>
                    </div>
                    
                    <div class="product-actions">
                        ${p.status === 'pending' ? `
                            <button class="btn btn-validate" onclick="validateProduct('${p.id}')">✓ Valider</button>
                            <button class="btn btn-reject" onclick="rejectProduct('${p.id}')">✗ Rejeter</button>
                        ` : `
                            <button class="btn btn-undo" onclick="resetProduct('${p.id}')">↩ Annuler</button>
                        `}
                    </div>
                </div>
            `}).join('');
            
            updateStats();
        }
        
        function updateStats() {
            const pending = products.filter(p => p.status === 'pending').length;
            const validated = products.filter(p => p.status === 'validated');
            const rejected = products.filter(p => p.status === 'rejected').length;
            
            document.getElementById('pending-count').textContent = pending;
            document.getElementById('validated-count').textContent = validated.length;
            document.getElementById('rejected-count').textContent = rejected;
            document.getElementById('history-count').textContent = Object.keys(history).length;
            
            const totalFiles = validated.length * ALL_LANGUAGES.length;
            document.getElementById('gen-count').textContent = `${validated.length} produit${validated.length > 1 ? 's' : ''}`;
            document.getElementById('total-files').textContent = totalFiles;
            document.getElementById('generation-panel').classList.toggle('visible', validated.length > 0);
        }
        
        function toggleSelect(id, checked) {
            if (checked) selectedProducts.add(id);
            else selectedProducts.delete(id);
            renderProducts();
        }
        
        function selectAllVisible() {
            const filtered = getFilteredProducts();
            const start = (currentPage - 1) * itemsPerPage;
            const pageProducts = filtered.slice(start, start + itemsPerPage).filter(p => p.status === 'pending');
            const allSelected = pageProducts.every(p => selectedProducts.has(p.id));
            
            pageProducts.forEach(p => {
                if (allSelected) selectedProducts.delete(p.id);
                else selectedProducts.add(p.id);
            });
            renderProducts();
            showToast(allSelected ? 'Désélectionné' : `${pageProducts.length} sélectionnés`, 'info');
        }
        
        function bulkValidate() {
            let count = 0;
            selectedProducts.forEach(id => {
                const p = products.find(pr => pr.id === id);
                if (p && p.status === 'pending') { p.status = 'validated'; count++; }
            });
            selectedProducts.clear();
            saveHistory();
            renderProducts();
            showToast(`✓ ${count} validés !`, 'success');
        }
        
        function bulkReject() {
            let count = 0;
            selectedProducts.forEach(id => {
                const p = products.find(pr => pr.id === id);
                if (p && p.status === 'pending') { p.status = 'rejected'; count++; }
            });
            selectedProducts.clear();
            saveHistory();
            renderProducts();
            showToast(`✗ ${count} rejetés`, 'error');
        }
        
        function validateProduct(id) {
            const p = products.find(pr => pr.id === id);
            if (p) { p.status = 'validated'; saveHistory(); renderProducts(); showToast(`✓ ${p.name.substring(0,25)}...`, 'success'); }
        }
        
        function rejectProduct(id) {
            const p = products.find(pr => pr.id === id);
            if (p) { p.status = 'rejected'; saveHistory(); renderProducts(); showToast(`✗ Rejeté`, 'error'); }
        }
        
        function resetProduct(id) {
            const p = products.find(pr => pr.id === id);
            if (p) { p.status = 'pending'; saveHistory(); renderProducts(); showToast('↩ Restauré', 'info'); }
        }
        
        // GitHub Push
        async function generateAndPush() {
            // Check token
            const tokenInput = document.getElementById('github-token').value.trim();
            if (tokenInput) {
                GITHUB_TOKEN = tokenInput;
                localStorage.setItem('github_token', tokenInput);
            }
            
            if (!GITHUB_TOKEN) {
                showToast('⚠️ Entre ton GitHub Token !', 'error');
                return;
            }
            
            const validated = products.filter(p => p.status === 'validated');
            if (validated.length === 0) return;
            
            const modal = document.getElementById('modal');
            const progressFill = document.getElementById('progress-fill');
            const progressText = document.getElementById('progress-text');
            const logArea = document.getElementById('log-area');
            
            modal.classList.add('visible');
            document.getElementById('btn-generate').disabled = true;
            logArea.innerHTML = '';
            
            const total = validated.length * ALL_LANGUAGES.length;
            let current = 0;
            let successCount = 0;
            
            function log(msg) { logArea.innerHTML += msg + '<br>'; logArea.scrollTop = logArea.scrollHeight; }
            
            log('🚀 Démarrage push GitHub...');
            log(`📦 ${validated.length} produits × ${ALL_LANGUAGES.length} langues`);
            
            for (const product of validated) {
                for (const lang of ALL_LANGUAGES) {
                    current++;
                    progressFill.style.width = `${Math.round((current / total) * 100)}%`;
                    progressText.textContent = `${current}/${total}`;
                    
                    const file = generateHugoFile(product, lang);
                    
                    try {
                        await pushToGitHub(file.path, file.content);
                        successCount++;
                    } catch (err) {
                        log(`❌ ${file.path}`);
                    }
                    
                    await new Promise(r => setTimeout(r, 80));
                }
                log(`✅ ${product.name}`);
            }
            
            document.getElementById('modal-title').textContent = '✅ Terminé !';
            progressText.textContent = `${successCount}/${total} fichiers`;
            log(`\n🎉 Push terminé !`);
            
            setTimeout(() => {
                modal.classList.remove('visible');
                document.getElementById('btn-generate').disabled = false;
                document.getElementById('modal-title').textContent = '🚀 Génération en cours...';
            }, 3000);
        }
        
        async function pushToGitHub(path, content) {
            const url = `https://api.github.com/repos/${GITHUB_REPO}/contents/${path}`;
            
            let sha = null;
            try {
                const getRes = await fetch(url, { headers: { 'Authorization': `token ${GITHUB_TOKEN}` }});
                if (getRes.ok) sha = (await getRes.json()).sha;
            } catch (e) {}
            
            const body = { message: `Add ${path}`, content: btoa(unescape(encodeURIComponent(content))), branch: 'main' };
            if (sha) body.sha = sha;
            
            const res = await fetch(url, {
                method: 'PUT',
                headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            
            if (!res.ok) throw new Error((await res.json()).message);
            return res.json();
        }
        
        function generateHugoFile(product, lang) {
            const slug = product.name.toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
            
            const folder = product.category === 'fragrance' ? 'perfumes' : product.category;
            
            return {
                path: `content/${lang}/${folder}/${slug}.md`,
                content: `---
title: "${product.name}"
brand: "${product.brand}"
date: ${new Date().toISOString().split('T')[0]}
draft: false
categories: ["${product.category}"]
tags: ["${product.brand.toLowerCase()}", "${product.category}", "${product.year}"]
year: ${product.year}
source_url: "${product.url}"
${product.notes ? `notes: "${product.notes}"` : ''}
---

${product.description}
`
            };
        }
        
        function showToast(message, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
        
        function saveToken() {
            const token = document.getElementById('github-token').value.trim();
            if (token) {
                localStorage.setItem('github_token', token);
                GITHUB_TOKEN = token;
                showToast('Token sauvegardé !', 'success');
            }
        }
        
        function loadToken() {
            const saved = localStorage.getItem('github_token');
            if (saved) {
                document.getElementById('github-token').value = saved;
                GITHUB_TOKEN = saved;
            }
        }
        
        // Event listeners
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentStatusFilter = tab.dataset.filter;
                currentPage = 1;
                renderProducts();
            });
        });
        
        document.querySelectorAll('.source-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.source-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentSourceFilter = btn.dataset.source;
                currentPage = 1;
                renderProducts();
            });
        });
        
        // Init
        initProducts();
        renderFilterBar();
        renderProducts();
        loadToken();
    </script>
</body>
</html>
