{{ define "title" }}{{ .Title }} | {{ .Site.Title }}{{ end }}

{{ define "main" }}
<article class="max-w-4xl mx-auto px-4 py-12">
    <header class="mb-8">
        <h1 class="text-4xl font-heading font-bold mb-4">{{ .Title }}</h1>
        <p class="text-textLight">{{ .Date.Format "January 2, 2006" }}</p>
    </header>
    {{ with .Params.image }}<img src="{{ . }}" alt="{{ $.Title }}" class="w-full rounded-xl mb-8">{{ end }}
    <div class="prose prose-lg max-w-none">{{ .Content }}</div>
</article>
{{ end }}
